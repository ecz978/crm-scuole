name: Android PDF reader

on:
  pull_request:
    paths:
      - "android-pdf-reader/**"
      - ".github/workflows/android-pdf-reader.yml"
  push:
    branches: [main]
    paths:
      - "android-pdf-reader/**"
      - ".github/workflows/android-pdf-reader.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-pdf-reader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, build, lint
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease lintRelease
      - name: APK size
        run: ls -l app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lettore-pdf-apk
          path: android-pdf-reader/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
