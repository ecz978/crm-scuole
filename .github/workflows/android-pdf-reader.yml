name: Android PDF reader

on:
  pull_request:
    paths:
      - "android-pdf-reader/**"
      - ".github/workflows/android-pdf-reader.yml"
  push:
    branches: [main]
    tags: ["lettore-pdf-v*"]
    paths:
      - "android-pdf-reader/**"
      - ".github/workflows/android-pdf-reader.yml"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Versione da pubblicare come Release (es. 1.0). Vuoto = solo build."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-pdf-reader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, build, lint
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease lintRelease
      - name: Lint report (solo se fallisce)
        if: failure()
        run: cat app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt || true
      - name: APK size
        run: ls -l app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lettore-pdf-apk
          path: android-pdf-reader/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # Pubblica l'APK come Release (link diretto, senza zip): su tag lettore-pdf-vX.Y
  # oppure da "Run workflow" indicando la versione. Il tag viene creato se manca.
  release:
    if: startsWith(github.ref, 'refs/tags/lettore-pdf-v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lettore-pdf-apk
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.release_version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#lettore-pdf-v}"
          fi
          mv app-release.apk "ECZ-PDF-reader-${version}.apk"
          gh release create "lettore-pdf-v${version}" "ECZ-PDF-reader-${version}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ECZ PDF reader ${version}" \
            --notes "APK firmato con la chiave di debug (sideload). Per aggiornare una versione già installata, disinstallala prima."
