plugins {
    id 'com.android.application'
}

android {
    namespace 'app.lettorepdf'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.ecz978.pdfreader'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '1.4'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Firmato con la chiave di debug: installabile subito (sideload).
            // Per Play Store serve una chiave di rilascio vera.
            signingConfig signingConfigs.debug
            // Niente hash del commit nell'APK: build riproducibile.
            vcsInfo.include = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }

    // F-Droid: niente blocchi di metadati firmati da Google nell'APK (privacy e build riproducibile).
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    lint {
        abortOnError true
        warningsAsErrors false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
